  function decodeAndInject() {
    try {
      var decoded = decodeURIComponent(escape(atob(encoded)));
      var container = document.body;
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = decoded;
      
      // Extrai e injeta o conteúdo HEAD
      var headContent = '';
      var newHead = tempDiv.querySelector('head');
      if(newHead) {
        headContent = newHead.innerHTML;
      }
      
      // Extrai e injeta o conteúdo BODY
      var bodyContent = '';
      var newBody = tempDiv.querySelector('body');
      if(newBody) {
        bodyContent = newBody.innerHTML;
      }
      
      // Se não encontrou head/body, usa o conteúdo completo
      if(!headContent && !bodyContent) {
        document.open();
        document.write(decoded);
        document.close();
        return;
      }
      
      // Injeta no head atual
      if(headContent) {
        document.head.innerHTML += headContent;
      }
      
      // Substitui o body
      if(bodyContent) {
        document.body.innerHTML = bodyContent;
      }
      
    } catch(e) {
      console.error('Erro ao decodificar:', e);
      document.body.innerHTML = '<div style="color:#ff4444;text-align:center;padding:40px"><h2>❌ Erro ao carregar projeto</h2><p>Arquivo corrompido ou inválido.</p></div>';
    }
  }
